<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Эмаль Mini App — превью для портфолио</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../emal-kit/kit.css?v=3">
<style>
/* Обложка карточки портфолио: три экрана записи рядом */
body{margin:0;width:1440px;height:900px;overflow:hidden;background:#e4e5e2}
.stage{display:flex;align-items:center;justify-content:center;gap:48px;height:100%}
.phone{width:342px;height:740px;overflow:hidden;border-radius:36px;border:10px solid #16181b;background:#fff;box-shadow:0 30px 60px rgba(22,24,27,.18)}
.phone iframe{width:390px;height:844px;border:0;transform:scale(.8256);transform-origin:0 0}
.phone:nth-child(2){transform:translateY(-24px)}
</style>
</head>
<body>
<div class="stage">
  <div class="phone"><iframe src="app.html?f=p1" title="Главная" tabindex="-1"></iframe></div>
  <div class="phone"><iframe src="app.html?page=time" title="Дата и время" tabindex="-1"></iframe></div>
  <div class="phone"><iframe src="app.html?page=done" title="Готово" tabindex="-1"></iframe></div>
</div>
</body>
</html>
